[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "popex"
version = "0.3.0"
description = "Local media ingestion and baseline audio-analysis foundation for PopEx"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi[standard]==0.139.2",
  "python-multipart>=0.0.20,<1",
  "yt-dlp[default]==2026.7.4",
  "librosa>=0.11,<1",
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
