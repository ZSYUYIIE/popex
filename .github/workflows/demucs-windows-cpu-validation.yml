name: Demucs Windows CPU profile validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtimes/profiles/windows-cpu/**"
      - "scripts/install_demucs_windows_cpu.ps1"
      - "tests/test_demucs_windows_cpu_profile.py"
      - "docs/runtime/demucs-windows-cpu.md"
      - ".github/workflows/demucs-windows-cpu-validation.yml"
      - "runtimes/demucs_worker/**"

permissions:
  contents: read

jobs:
  resolve-windows-wheels:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Record Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest
          python -c "import json, platform, sys; print(json.dumps({'platform': platform.platform(), 'python': sys.version, 'machine': platform.machine()}, sort_keys=True))"

      - name: Resolve exact Windows wheels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $Evidence = Join-Path $env:RUNNER_TEMP "popex-windows-cpu-evidence"
          $Wheelhouse = Join-Path $Evidence "wheelhouse"
          $Resolver = Join-Path $env:RUNNER_TEMP "popex-windows-cpu-resolver"
          New-Item -ItemType Directory -Force -Path $Evidence, $Wheelhouse | Out-Null
          python -m venv $Resolver
          $Python = Join-Path $Resolver "Scripts\python.exe"

          @'
          anyio==4.14.2
          certifi==2026.7.22
          click==8.4.2
          demucs==4.1.0
          einops==0.8.2
          filelock==3.29.0
          fsspec==2026.4.0
          h11==0.16.0
          hf-xet==1.6.0
          httpcore==1.0.9
          httpx==0.28.1
          huggingface-hub==1.26.0
          idna==3.18
          Jinja2==3.1.6
          julius==0.2.8
          lameenc==1.8.4
          MarkupSafe==3.0.3
          mpmath==1.3.0
          networkx==3.6.1
          numpy==2.5.1
          packaging==26.2
          PyYAML==6.0.3
          safetensors==0.8.0
          setuptools==78.1.0
          sphn==0.2.1
          sympy==1.14.0
          tqdm==4.70.0
          typing-extensions==4.15.0
          '@ | Set-Content -Encoding utf8 (Join-Path $Evidence "constraints.txt")

          & $Python -m pip download `
            --no-deps `
            --only-binary=:all: `
            --dest $Wheelhouse `
            --index-url https://download.pytorch.org/whl/cpu `
            "torch==2.13.0+cpu"
          if ($LASTEXITCODE -ne 0) { throw "Official Windows CPU Torch wheel resolution failed." }

          $TorchWheel = Get-ChildItem $Wheelhouse -Filter "torch-2.13.0+cpu-cp313-cp313-win_amd64.whl" | Select-Object -First 1
          if (-not $TorchWheel) { throw "The exact CPython 3.13 Windows x86-64 Torch CPU wheel was not selected." }
          & $Python -m pip install --no-deps $TorchWheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installing the resolver Torch wheel failed." }

          & $Python -m pip install `
            --dry-run `
            --report (Join-Path $Evidence "ordinary-report.json") `
            --only-binary=:all: `
            --index-url https://pypi.org/simple `
            --constraint (Join-Path $Evidence "constraints.txt") `
            -r runtimes/profiles/windows-cpu/requirements.in
          if ($LASTEXITCODE -ne 0) { throw "The constrained Windows runtime set could not be resolved as wheels." }

          @'
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys
          from urllib.parse import unquote, urlparse

          evidence = pathlib.Path(sys.argv[1])
          wheelhouse = pathlib.Path(sys.argv[2])
          python = sys.argv[3]
          report = json.loads((evidence / "ordinary-report.json").read_text(encoding="utf-8"))
          selected = []
          requirement_lines = []
          for item in report["install"]:
              metadata = item["metadata"]
              name = metadata["name"]
              version = metadata["version"]
              url = item["download_info"]["url"]
              filename = pathlib.PurePosixPath(unquote(urlparse(url).path)).name
              hashes = item["download_info"].get("archive_info", {}).get("hashes", {})
              sha256 = hashes.get("sha256")
              if not filename.endswith(".whl") or not sha256:
                  raise SystemExit(f"Non-wheel or unhashed artifact selected: {name} {filename}")
              selected.append({"name": name, "version": version, "url": url, "filename": filename, "sha256": sha256})
              requirement_lines.append(f"{name}=={version}")
          (evidence / "resolved-requirements.txt").write_text("\n".join(requirement_lines) + "\n", encoding="utf-8")
          (evidence / "ordinary-artifacts.json").write_text(json.dumps(selected, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          subprocess.run([
              python, "-m", "pip", "download", "--no-deps", "--only-binary=:all:",
              "--dest", str(wheelhouse), "--index-url", "https://pypi.org/simple",
              "-r", str(evidence / "resolved-requirements.txt")
          ], check=True)
          actual = {}
          for path in wheelhouse.glob("*.whl"):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              actual[path.name] = digest
          for artifact in selected:
              if actual.get(artifact["filename"]) != artifact["sha256"]:
                  raise SystemExit(f"Downloaded hash mismatch: {artifact['filename']}")
          torch_files = [path for path in wheelhouse.glob("torch-2.13.0+cpu-cp313-cp313-win_amd64.whl")]
          if len(torch_files) != 1:
              raise SystemExit("Expected exactly one Windows Torch CPU wheel")
          torch = torch_files[0]
          torch_record = {
              "name": "torch",
              "version": "2.13.0+cpu",
              "url": "https://download.pytorch.org/whl/cpu/" + torch.name,
              "filename": torch.name,
              "sha256": hashlib.sha256(torch.read_bytes()).hexdigest(),
          }
          (evidence / "torch-artifact.json").write_text(json.dumps(torch_record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (evidence / "downloaded-hashes.json").write_text(json.dumps(actual, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"ordinaryArtifacts": len(selected), "torch": torch_record}, sort_keys=True))
          '@ | & $Python - $Evidence $Wheelhouse $Python
          if ($LASTEXITCODE -ne 0) { throw "Artifact evidence generation failed." }

      - name: Upload resolver evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-wheel-evidence
          path: |
            ${{ runner.temp }}/popex-windows-cpu-evidence/ordinary-report.json
            ${{ runner.temp }}/popex-windows-cpu-evidence/ordinary-artifacts.json
            ${{ runner.temp }}/popex-windows-cpu-evidence/torch-artifact.json
            ${{ runner.temp }}/popex-windows-cpu-evidence/downloaded-hashes.json
            ${{ runner.temp }}/popex-windows-cpu-evidence/resolved-requirements.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary wheels
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "popex-windows-cpu-evidence")
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "popex-windows-cpu-resolver")
