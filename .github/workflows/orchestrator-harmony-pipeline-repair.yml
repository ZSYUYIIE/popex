name: Orchestrator harmony pipeline fixture repair

on:
  push:
    branches:
      - orchestrator/harmony-pipeline

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orchestrator/harmony-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Repair valid interpretation alignment fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_harmony_pipeline.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _alignment(events: list[dict]) -> list[dict]:
    result = []
    for event in events:
        raw_time = event["startSeconds"]
        result.append(
            {
                "eventId": event["id"],
                "eventType": "pitched",
                "rawTimeSeconds": raw_time,
                "beatIndex": 0,
                "subdivision": 4,
                "subdivisionIndex": min(3, int(round(raw_time * 4))),
                "alignedTimeSeconds": raw_time,
                "offsetSeconds": 0.0,
                "confidence": 0.9,
                "measureIndex": 0,
                "beatInMeasure": 1,
            }
        )
    return result
'''
          new = '''def _alignment(events: list[dict]) -> list[dict]:
    result = []
    for event in events:
        raw_time = event["startSeconds"]
        result.append(
            {
                "eventId": event["id"],
                "eventType": "pitched",
                "rawTimeSeconds": raw_time,
                "beatIndex": 0,
                "subdivision": 1,
                "subdivisionIndex": 0,
                "alignedTimeSeconds": 0.0,
                "offsetSeconds": raw_time,
                "confidence": 0.9,
                "measureIndex": 0,
                "beatInMeasure": 1,
            }
        )
    return result
'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("alignment fixture marker is ambiguous")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("alignment fixture marker not found")
          PY
          pip install -e '.[dev]'
          pytest tests/test_harmony_pipeline.py
          pytest
          python -m compileall -q app tests
          node --check app/static/app.js
          git diff --check
          if git diff --quiet -- tests/test_harmony_pipeline.py; then
            exit 0
          fi
          git config user.name popex-orchestrator
          git config user.email actions@users.noreply.github.com
          git add tests/test_harmony_pipeline.py
          git commit -m "Repair harmony pipeline interpretation fixture"
          git push origin HEAD:orchestrator/harmony-pipeline
