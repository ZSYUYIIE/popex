name: Orchestrator harmony pipeline fixture repair

on:
  push:
    branches:
      - orchestrator/harmony-pipeline

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orchestrator/harmony-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Repair and validate harmony pipeline
        run: |
          python .github/scripts/orchestrator_harmony_pipeline_repair.py
          pip install -e '.[dev]'
          pytest tests/test_harmony_pipeline.py
          pytest
          python -m compileall -q app tests
          node --check app/static/app.js
          git diff --check
          if git diff --quiet -- tests/test_harmony_pipeline.py; then
            exit 0
          fi
          git config user.name popex-orchestrator
          git config user.email actions@users.noreply.github.com
          git add tests/test_harmony_pipeline.py
          git commit -m "Repair harmony pipeline interpretation fixture"
          git push origin HEAD:orchestrator/harmony-pipeline
