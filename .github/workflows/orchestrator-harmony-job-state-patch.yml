name: Orchestrator harmony job-state patch

on:
  push:
    branches:
      - orchestrator/harmony-job-state

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orchestrator/harmony-job-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Patch and validate durable harmony state
        run: |
          python .github/scripts/orchestrator_harmony_job_state_patch.py
          pip install -e '.[dev]'
          pytest tests/test_db_harmony.py
          pytest
          python -m compileall -q app tests
          node --check app/static/app.js
          git diff --check
          if git diff --quiet -- app/db.py; then
            exit 0
          fi
          git config user.name popex-orchestrator
          git config user.email actions@users.noreply.github.com
          git add app/db.py
          git commit -m "Persist durable harmonic-context job state"
          git push origin HEAD:orchestrator/harmony-job-state
