name: Orchestrator harmonic frontend patch

on:
  push:
    branches:
      - orchestrator/harmony-frontend

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orchestrator/harmony-frontend
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Patch and validate harmonic frontend
        run: |
          python .github/scripts/orchestrator_harmony_frontend_patch.py
          pip install -e '.[dev]'
          pytest tests/test_frontend_harmony.py
          pytest
          python -m compileall -q app tests
          node --check app/static/app.js
          git diff --check
          if git diff --quiet -- app/static/app.js; then
            exit 0
          fi
          git config user.name popex-orchestrator
          git config user.email actions@users.noreply.github.com
          git add app/static/app.js
          git commit -m "Add harmonic-context review panel"
          git push origin HEAD:orchestrator/harmony-frontend
