name: Temporary PR 61 test URL repair

on:
  push:
    branches:
      - agent/transcription-api-integration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transcription-api-integration
      - name: Repair strict-query test URL
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/test_transcription_api.py")
          source = path.read_text(encoding="utf-8")
          broken = 'f"/api/jobs/{job_id}/transcription/includeEvents=1"'
          fixed = 'f"/api/jobs/{job_id}/transcription?includeEvents=1"'
          assert source.count(broken) == 1
          path.write_text(source.replace(broken, fixed), encoding="utf-8")
      - name: Validate focused test
        run: |
          pip install -e '.[dev]'
          pytest -q tests/test_transcription_api.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_transcription_api.py
          git commit -m "Fix strict transcription query test URL"
          git push origin HEAD:agent/transcription-api-integration
