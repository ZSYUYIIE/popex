name: Temporary PR 61 syntax repair

on:
  push:
    branches:
      - agent/transcription-api-integration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transcription-api-integration
      - name: Repair transfer-damaged syntax
        shell: python
        run: |
          from pathlib import Path

          main = Path("app/main.py")
          source = main.read_text(encoding="utf-8")
          broken = "    analysis_processor: AnalysisProcessor,\n] -> None:"
          fixed = "    analysis_processor: AnalysisProcessor,\n) -> None:"
          assert source.count(broken) == 1, "unexpected main.py syntax shape"
          main.write_text(source.replace(broken, fixed), encoding="utf-8")

          tests = Path("tests/test_transcription_api.py")
          source = tests.read_text(encoding="utf-8")
          broken = '    assert contract["detailsUrl"].endswith("?includeEvents=false"\n'
          fixed = '    assert contract["detailsUrl"].endswith("?includeEvents=false")\n'
          assert source.count(broken) == 1, "unexpected API-test syntax shape"
          tests.write_text(source.replace(broken, fixed), encoding="utf-8")
      - name: Validate syntax
        run: python -m py_compile app/main.py tests/test_transcription_api.py
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py tests/test_transcription_api.py
          git commit -m "Repair PR 61 syntax transfer damage"
          git push origin HEAD:agent/transcription-api-integration
