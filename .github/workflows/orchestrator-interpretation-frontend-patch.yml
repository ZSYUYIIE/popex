name: Orchestrator interpretation frontend patch

on:
  push:
    branches:
      - orchestrator/interpretation-frontend

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orchestrator/interpretation-frontend
          fetch-depth: 0
      - name: Patch app.js
        run: |
          python .github/scripts/orchestrator_interpretation_frontend_patch.py
          node --check app/static/app.js
          if git diff --quiet -- app/static/app.js; then
            exit 0
          fi
          git config user.name "popex-orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add app/static/app.js
          git commit -m "Add editable interpretation review panel"
          git push origin HEAD:orchestrator/interpretation-frontend
