name: Orchestrator interpretation label fix

on:
  push:
    branches:
      - orchestrator/interpretation-frontend

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orchestrator/interpretation-frontend
          fetch-depth: 0
      - name: Improve algorithm labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/static/app.js")
          text = path.read_text(encoding="utf-8")
          old = 'const safeName=safeSlugLabel(name);let version="";'
          new = 'const safeName=safeSlugLabel(String(name).replace(/([a-z0-9])([A-Z])/g,"$1 $2"));let version="";'
          if text.count(old) != 1:
              raise SystemExit(f"expected one algorithm label marker, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          node --check app/static/app.js
          git config user.name "popex-orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add app/static/app.js
          git commit -m "Humanize interpretation algorithm labels"
          git push origin HEAD:orchestrator/interpretation-frontend
