name: Orchestrator interpretation label fix

on:
  push:
    branches:
      - orchestrator/interpretation-frontend

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orchestrator/interpretation-frontend
          fetch-depth: 0
      - name: Improve interpretation algorithm labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/static/app.js")
          text = path.read_text(encoding="utf-8")
          old = 'const safeName=safeSlugLabel(name);let version="";'
          new = 'const safeName=safeSlugLabel(String(name).replace(/([a-z0-9])([A-Z])/g,"$1 $2"));let version="";'
          index = text.rfind(old)
          if index < 0:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("interpretation algorithm label marker not found")
          text = text[:index] + new + text[index + len(old):]
          path.write_text(text, encoding="utf-8")
          PY
          node --check app/static/app.js
          if git diff --quiet -- app/static/app.js; then
            exit 0
          fi
          git config user.name "popex-orchestrator"
          git config user.email "actions@users.noreply.github.com"
          git add app/static/app.js
          git commit -m "Humanize interpretation algorithm labels"
          git push origin HEAD:orchestrator/interpretation-frontend
