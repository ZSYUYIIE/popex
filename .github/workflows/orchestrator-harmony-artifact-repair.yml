name: Orchestrator harmony artifact repair

on:
  push:
    branches:
      - orchestrator/harmony-artifacts

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orchestrator/harmony-artifacts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Repair validator and non-chord fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          module_path = Path("app/harmony_artifacts.py")
          tests_path = Path("tests/test_harmony_artifacts.py")
          module = module_path.read_text(encoding="utf-8")
          tests = tests_path.read_text(encoding="utf-8")

          old_keys = '''    keys = set(value)\n    missing = required - keys\n    unknown = keys - required - optional\n    if missing:\n        raise HarmonyArtifactValidationError(\n            f"{label} is missing required fields: {', '.join(sorted(missing))}."\n        )\n    if unknown:\n        raise HarmonyArtifactValidationError(\n            f"{label} contains unsupported fields: {', '.join(sorted(unknown))}."\n        )\n    if not all(isinstance(key, str) for key in value):\n        raise HarmonyArtifactValidationError(f"{label} contains a non-string field.")\n'''
          new_keys = '''    if not all(isinstance(key, str) for key in value):\n        raise HarmonyArtifactValidationError(f"{label} contains a non-string field.")\n    keys = set(value)\n    missing = required - keys\n    unknown = keys - required - optional\n    if missing:\n        raise HarmonyArtifactValidationError(\n            f"{label} is missing required fields: {', '.join(sorted(missing))}."\n        )\n    if unknown:\n        raise HarmonyArtifactValidationError(\n            f"{label} contains unsupported fields: {', '.join(sorted(unknown))}."\n        )\n'''
          old_event = '''            event("g", 67, source="other", midi_pitch=67.04),\n'''
          new_event = '''            event("g", 67, source="other", midi_pitch=67.04),\n            event(\n                "fsharp",\n                66,\n                source="other",\n                confidence=0.18,\n                midi_pitch=66.03,\n            ),\n'''

          changed = False
          if old_keys in module:
              if module.count(old_keys) != 1:
                  raise SystemExit("validator key marker is ambiguous")
              module = module.replace(old_keys, new_keys, 1)
              changed = True
          elif new_keys not in module:
              raise SystemExit("validator key marker not found")

          if old_event in tests:
              if tests.count(old_event) != 1:
                  raise SystemExit("resolved fixture marker is ambiguous")
              tests = tests.replace(old_event, new_event, 1)
              changed = True
          elif new_event not in tests:
              raise SystemExit("resolved fixture marker not found")

          if changed:
              module_path.write_text(module, encoding="utf-8")
              tests_path.write_text(tests, encoding="utf-8")
          PY
          pip install -e '.[dev]'
          pytest tests/test_harmony_artifacts.py
          pytest
          python -m compileall -q app tests
          node --check app/static/app.js
          git diff --check
          if git diff --quiet -- app/harmony_artifacts.py tests/test_harmony_artifacts.py; then
            exit 0
          fi
          git config user.name popex-orchestrator
          git config user.email actions@users.noreply.github.com
          git add app/harmony_artifacts.py tests/test_harmony_artifacts.py
          git commit -m "Repair harmony artifact validation coverage"
          git push origin HEAD:orchestrator/harmony-artifacts
