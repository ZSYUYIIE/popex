name: Demucs Linux real-model end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demucs-linux-real-model-e2e
  cancel-in-progress: false

jobs:
  linux-real-model-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_UPDATE_CHECK: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONNOUSERSITE: "1"
      HF_TOKEN: "popex-e2e-token-must-not-propagate"
      HUGGING_FACE_HUB_TOKEN: "popex-e2e-token-must-not-propagate"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lightweight base application
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'

      - name: Run permanent offline contract tests
        shell: bash
        run: |
          set -euo pipefail
          pytest tests/test_demucs_linux_real_model_e2e.py

      - name: Define isolated temporary paths
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/popex-demucs-real-runtime-$GITHUB_RUN_ID"
          cache="$RUNNER_TEMP/popex-demucs-real-cache-$GITHUB_RUN_ID"
          data="$RUNNER_TEMP/popex-demucs-real-data-$GITHUB_RUN_ID"
          summary="$RUNNER_TEMP/popex-demucs-real-summary-$GITHUB_RUN_ID.json"
          rm -rf -- "$runtime" "$cache" "$data" "$summary"
          {
            echo "POPEX_E2E_RUNTIME=$runtime"
            echo "POPEX_E2E_CACHE=$cache"
            echo "POPEX_E2E_DATA=$data"
            echo "POPEX_E2E_SUMMARY=$summary"
          } >> "$GITHUB_ENV"

      - name: Install exact Linux CPU runtime profile
        shell: bash
        run: |
          set -euo pipefail
          export POPEX_DEMUCS_LINUX_CPU_DIR="$POPEX_E2E_RUNTIME"
          export POPEX_DEMUCS_PYTHON="$(command -v python)"
          export POPEX_DEMUCS_WORKER_DIR="$GITHUB_WORKSPACE/runtimes/demucs_worker"
          bash scripts/install_demucs_linux_cpu.sh

      - name: Run explicit-consent real-model product validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_demucs_linux_real_model_e2e.py \
            --worker "$POPEX_E2E_RUNTIME/venv/bin/popex-demucs-worker" \
            --runtime-lock "$POPEX_E2E_RUNTIME/runtime-lock.json" \
            --cache-root "$POPEX_E2E_CACHE" \
            --data-dir "$POPEX_E2E_DATA" \
            --expected-profile linux-x86_64-cpu-cpython313 \
            --timeout-seconds 3600 \
            | tee "$POPEX_E2E_SUMMARY"

      - name: Verify safe summary and local-only evidence
        shell: bash
        run: |
          set -euo pipefail
          python - "$POPEX_E2E_SUMMARY" "$POPEX_E2E_RUNTIME" "$POPEX_E2E_CACHE" "$POPEX_E2E_DATA" <<'PY'
          import json
          from pathlib import Path
          import sys

          summary_path, runtime_raw, cache_raw, data_raw = sys.argv[1:]
          summary = json.loads(Path(summary_path).read_text(encoding="utf-8"))
          expected_keys = {
              "schemaVersion",
              "runtimeProfile",
              "workerVersion",
              "demucsVersion",
              "torchVersion",
              "modelRevision",
              "checkpointSizeBytes",
              "checkpointSha256",
              "jobStatus",
              "stemKinds",
              "stemMetrics",
              "elapsedPreparationSeconds",
              "elapsedInferenceSeconds",
              "peakProcessRssMiB",
          }
          if set(summary) != expected_keys:
              raise SystemExit("Safe real-model summary fields changed")
          expected = {
              "schemaVersion": 1,
              "runtimeProfile": "linux-x86_64-cpu-cpython313",
              "workerVersion": "1.0.0",
              "demucsVersion": "4.1.0",
              "torchVersion": "2.13.0+cpu",
              "modelRevision": "bf35a81b663819a8255c8fefee17f9d812b786b5",
              "checkpointSizeBytes": 84025440,
              "checkpointSha256": "d9fa14133cfcc034a6758923bb3a8ca9f8dfd0b582134643bbf83f72c17576dd",
              "jobStatus": "completed",
              "stemKinds": ["vocals", "bass", "drums", "other"],
          }
          for key, value in expected.items():
              if summary.get(key) != value:
                  raise SystemExit(f"Safe real-model summary mismatch: {key}")
          serialized = json.dumps(summary, sort_keys=True)
          forbidden = (
              runtime_raw,
              cache_raw,
              data_raw,
              "popex-e2e-token-must-not-propagate",
              "http://",
              "https://",
              "hf://",
              "\\",
          )
          if any(value and value in serialized for value in forbidden):
              raise SystemExit("Safe summary exposed a path, token, or model URL")
          if "/" in serialized:
              raise SystemExit("Safe summary exposed a path-like value")
          for metric in summary["stemMetrics"]:
              if metric["durationSeconds"] <= 0 or metric["sizeBytes"] <= 0:
                  raise SystemExit("Safe summary contains an invalid stem metric")

          runtime = Path(runtime_raw).resolve(strict=True)
          cache = Path(cache_raw).resolve(strict=True)
          data = Path(data_raw).resolve(strict=True)
          legacy = [
              path
              for root in (runtime, cache)
              for pattern in ("*.th", "*.ckpt")
              for path in root.rglob(pattern)
          ]
          if legacy:
              raise SystemExit("A legacy model checkpoint path was used")
          leaked_source = [
              path
              for root in (runtime, cache)
              for path in root.rglob("*")
              if path.name in {"analysis.wav", "source-synthetic.wav"}
          ]
          if leaked_source:
              raise SystemExit("Synthetic source audio left the app data directory")
          if not any(data.rglob("stem-separation.json")):
              raise SystemExit("The schema-3 stem manifest was not published")
          PY

      - name: Remove temporary runtime, model cache, app data, and summary
        if: always()
        shell: bash
        run: |
          rm -rf -- \
            "${POPEX_E2E_RUNTIME:-}" \
            "${POPEX_E2E_CACHE:-}" \
            "${POPEX_E2E_DATA:-}" \
            "${POPEX_E2E_SUMMARY:-}"
